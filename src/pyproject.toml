[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opentlv"
version = "0.1.0"
description = "Python bindings for OpenTLV, a portable C99 library for reading, writing and validating TLV data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["opentlv-core==0.1.0"]

[project.urls]
Homepage = "https://github.com/OpenTLV/opentlv-python"
Issues = "https://github.com/OpenTLV/opentlv-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["opentlv"]

[tool.hatch.build.targets.sdist]
include = ["/opentlv", "/pyproject.toml", "/README.md"]
