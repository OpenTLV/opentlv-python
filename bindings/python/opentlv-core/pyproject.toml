[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "opentlv-core"
version = "0.1.0"
description = "Native Python extension registering the raw OpenTLV C API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[tool.scikit-build]
cmake.source-dir = "../../.."
wheel.packages = []
wheel.py-api = "cp311"

[tool.scikit-build.cmake.define]
OPENTLV_BUILD_PYTHON = "ON"
OPENTLV_BUILD_CXX = "OFF"
OPENTLV_BUILD_TESTS = "OFF"
OPENTLV_BUILD_EXAMPLES = "OFF"
OPENTLV_BUILD_SHARED_LIBS = "OFF"
OPENTLV_WARNINGS_AS_ERRORS = "OFF"
