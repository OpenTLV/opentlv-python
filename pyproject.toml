[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "opentlv"
version = "0.1.0"
description = "Python bindings for OpenTLV, a portable C99 library for reading, writing and validating TLV data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/OpenTLV/opentlv-python"
Issues = "https://github.com/OpenTLV/opentlv-python/issues"

[tool.scikit-build]
cmake.version = ">=3.26"
# The native module and the public package keep separate source trees and
# install side by side: _opentlv at the wheel root, opentlv from src/opentlv.
wheel.packages = ["src/opentlv"]
wheel.py-api = "cp311"
build.targets = ["_opentlv"]
install.components = ["Python"]
sdist.include = ["CMakeLists.txt", "cmake/**", "scripts/**", "native/**", "src/**", "tests/**", "examples/**",
                 "docs/migration/source-inventory.json"]
sdist.exclude = ["build/**", "dist/**", ".venv/**", ".vscode/**",
                 "**/__pycache__/**", "**/*.pyc"]
