[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "opentlv-core"
version = "0.1.0"
description = "Native Python extension registering the raw OpenTLV C API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[tool.scikit-build]
cmake.version = ">=3.26"
wheel.packages = []
wheel.py-api = "cp311"
build.targets = ["_opentlv"]
install.components = ["Python"]
sdist.include = ["CMakeLists.txt", "cmake/**", "scripts/**", "bindings/**"]
sdist.exclude = ["build/**", "dist/**", ".venv/**", ".vscode/**",
                 "**/__pycache__/**", "**/*.pyc"]
