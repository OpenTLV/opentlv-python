name: Python release preparation
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unused Python tag matching the package version, CHANGELOG.md and docs/release-notes.md (v0.1.0)
        required: true
        type: string
      publish_release:
        description: Create the requested tag and GitHub release after Full verification
        type: boolean
        default: false
      pypi:
        description: Upload the verified packages to testpypi, or to pypi after the GitHub release of this run
        type: choice
        options: [none, testpypi, pypi]
        default: none
permissions:
  contents: read
concurrency:
  group: python-release-preparation
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          PYPI_TARGET: ${{ inputs.pypi }}
        run: python -B scripts/release.py preflight
  full:
    needs: preflight
    permissions:
      contents: read
      attestations: read
      actions: read
      security-events: write
    uses: ./.github/workflows/python-full.yml
    with:
      require_verified_core: true
  assemble:
    needs: [preflight, full]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: python-quality-full-${{ github.run_attempt }}
          path: build/quality
      - uses: actions/download-artifact@v4
        with:
          pattern: python-build-full-*-${{ github.run_attempt }}
          path: build/evidence
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python -B scripts/release.py assemble --evidence build/evidence
          --quality build/quality/quality.json --output build/release
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: build/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-release-candidate-${{ github.run_attempt }}
          path: build/release/*
          if-no-files-found: error
  publish:
    name: Publish verified Python release
    needs: [full, assemble]
    if: inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: python-release-candidate-${{ github.run_attempt }}
          path: build/release
      - name: Verify attested candidate and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          FULL_RESULT: ${{ needs.full.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
        run: python -B scripts/publish_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: component-release-${{ github.run_attempt }}
          path: build/docs-release/release.json
          if-no-files-found: error
  pypi:
    name: Publish verified Python packages to ${{ inputs.pypi }}
    needs: [full, assemble, publish]
    # PyPI follows the GitHub release of this run; a TestPyPI rehearsal may run without it.
    if: >-
      !cancelled() && inputs.pypi != 'none' &&
      needs.full.result == 'success' && needs.assemble.result == 'success' &&
      (needs.publish.result == 'success' || (inputs.pypi == 'testpypi' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-24.04
    # Protected environments limit deployment to main and require approval; PyPI trusts only this
    # repository, workflow and environment through OIDC, so no index token is stored.
    environment:
      name: ${{ inputs.pypi }}
      url: ${{ inputs.pypi == 'pypi' && 'https://pypi.org/project/opentlv/' || 'https://test.pypi.org/project/opentlv/' }}
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # Re-running only failed jobs keeps the candidate of the attempt that assembled it.
      - uses: actions/download-artifact@v4
        with:
          pattern: python-release-candidate-*
          path: build/candidates
      - name: Verify the candidate, release state and package index
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PYPI_TARGET: ${{ inputs.pypi }}
          FULL_RESULT: ${{ needs.full.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: python -B scripts/publish_pypi.py prepare
      - name: Upload through Trusted Publishing
        if: steps.prepare.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ steps.prepare.outputs.repository_url }}
          packages-dir: build/pypi/upload
          attestations: true
          skip-existing: false
      - name: Confirm the published files
        env:
          PYPI_TARGET: ${{ inputs.pypi }}
        run: python -B scripts/publish_pypi.py confirm
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-index-${{ inputs.pypi }}-${{ github.run_attempt }}
          path: |
            build/pypi/plan.json
            build/pypi/receipt.json
          if-no-files-found: error
