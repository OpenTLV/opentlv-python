name: Python release preparation
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unused Python tag matching the package version, CHANGELOG.md and docs/release-notes.md (v0.1.0)
        required: true
        type: string
      publish_release:
        description: Create the requested tag and GitHub release after Full verification (no PyPI upload)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: python-release-preparation
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -B scripts/release.py preflight
  full:
    needs: preflight
    permissions:
      contents: read
      attestations: read
      actions: read
      security-events: write
    uses: ./.github/workflows/python-full.yml
    with:
      require_verified_core: true
  assemble:
    needs: [preflight, full]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: python-quality-full-${{ github.run_attempt }}
          path: build/quality
      - uses: actions/download-artifact@v4
        with:
          pattern: python-build-full-*-${{ github.run_attempt }}
          path: build/evidence
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python -B scripts/release.py assemble --evidence build/evidence
          --quality build/quality/quality.json --output build/release
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: build/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-release-candidate-${{ github.run_attempt }}
          path: build/release/*
          if-no-files-found: error
  publish:
    name: Publish verified Python release
    needs: [full, assemble]
    if: inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: python-release-candidate-${{ github.run_attempt }}
          path: build/release
      - name: Verify attested candidate and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          FULL_RESULT: ${{ needs.full.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
        run: python -B scripts/publish_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: component-release-${{ github.run_attempt }}
          path: build/docs-release/release.json
          if-no-files-found: error
