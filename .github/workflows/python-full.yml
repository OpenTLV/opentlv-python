name: Python Full CI
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      require_verified_core:
        type: boolean
        default: false
permissions:
  contents: read
  attestations: read
  actions: read
  security-events: write
concurrency:
  group: python-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/python-checks.yml
    with:
      tier: full
      require_verified_core: ${{ inputs.require_verified_core || false }}
