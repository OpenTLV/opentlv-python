name: Python source quality
on:
  workflow_call:
permissions:
  contents: read
  attestations: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y clang-18 clang-tidy-18 cppcheck ninja-build
      - run: python -m pip install -r requirements-dev.txt clang-format==23.1.1 'reuse[charset-normalizer]==6.2.0'
      - name: Formatting and infrastructure regressions
        run: |
          python -B scripts/check_quality.py
          python -B -m pytest -p no:cacheprovider -q tests/build tests/ci
      - name: Validate Actions expressions and shell steps
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - name: Configure extension compilation database
        run: >-
          cmake -S . -B build/static -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "-DPython_EXECUTABLE=$(command -v python)"
      - run: python -B scripts/check_static.py --build build/static --tool clang-tidy
      - if: ${{ !cancelled() }}
        run: python -B scripts/check_static.py --build build/static --tool cppcheck
